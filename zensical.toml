[project]
site_name = "Upstream Data - Docs"
site_description = "Documentation for Upstream Data hardware."
site_author = "Upstream Data"
site_url = "https://docs.upstreamdata.com/"
copyright = "Copyright &copy; 2026 Upstream Data Inc\n"
use_directory_urls = true
extra_css = [
    "stylesheets/images.css",
]
extra_javascript = [
    "javascripts/pdf-download.js",
]
markdown_extensions = [
    "attr_list",
    "admonition",
    "pymdownx.details",
    "pymdownx.superfences",
    { "pymdownx.tabbed" = { alternate_style = true, slugify = { case = "lower" } } },
    "md_in_html",
    "pymdownx.blocks.caption",
    "pymdownx.snippets",
    "abbr",
    { "pymdownx.tasklist" = { custom_checkbox = true } },
    { toc = { permalink = true } },
    { "pymdownx.emoji" = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" } },
    "tables",
    "pymdownx.caret",
    "pymdownx.tilde",
    "pymdownx.mark",
    "pymdownx.smartsymbols",
]
nav = [
    "index.md",
    "parallel-units.md",
    "maintenance.md",
    "loadsync.md",
    "contact.md",
    { Changelog = [
    "changelogs/loadsync/index.md",
    "changelogs/loadsync/v0.3.0.md",
    "changelogs/loadsync/v0.3.1.md",
    "changelogs/loadsync/v0.3.2.md",
    "changelogs/loadsync/v0.3.3.md",
    "changelogs/loadsync/v0.3.4.md",
    "changelogs/loadsync/v0.4.0.md",
    "changelogs/loadsync/v0.4.1.md",
    "changelogs/loadsync/v0.5.0.md",
    "changelogs/loadsync/v0.5.1.md",
    "changelogs/loadsync/v0.5.2.md",
    "changelogs/loadsync/v0.5.3.md",
    "changelogs/loadsync/v0.6.0.md",
    "changelogs/loadsync/v0.6.1.md",
    "changelogs/loadsync/v0.6.2.md",
    "changelogs/loadsync/v0.6.3.md",
    "changelogs/loadsync/v0.6.4.md",
] },
]

[project.theme]
favicon = "logo/logo.svg"
logo = "logo/logo.svg"
language = "en"
features = [
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
    "toc.integrate",
    "content.tooltips",
    "content.tabs.link",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"

[project.theme.palette.toggle]
icon = "lucide/sun"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"

[project.theme.palette.toggle]
icon = "lucide/moon"
name = "Switch to light mode"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[project.theme.icon.admonition]
tip = "lucide/wrench"
success = "lucide/wrench"
question = "lucide/wrench"
warning = "lucide/wrench"
failure = "lucide/wrench"
danger = "lucide/wrench"
example = "lucide/wrench"

[project.extra]
social = [
    { icon = "lucide/mail", name = "Contact Support", link = "mailto:support@upstreamdata.com" },
    { icon = "lucide/globe", name = "Website", link = "upstreamdata.com" },
]
